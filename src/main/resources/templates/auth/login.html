<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <div th:replace="~{fragments/config :: tailwind-cdn}"></div>
    <div th:replace="~{fragments/config :: font-google}"></div>
</head>
<body class="font-body bg-surface text-content h-screen flex items-center justify-center">
    <div class="relative p-8 grid gap-8 rounded-lg shadow-lg w-full max-w-lg">
        <div th:replace="~{fragments/components :: title-page(text='Login')}"></div>
        <div th:replace="~{fragments/components :: errorGlobal}"></div>
        <form th:action="@{/auth/signIn}" th:object="${login}" method="post" class="grid gap-6 animate-slide-up delay-100">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:replace="~{fragments/components :: input-text(email, 'Example: example@gmail.com', 11, ${apiError})}"></div>
            <div th:replace="~{fragments/components :: input-text('password', 'Password', 6, ${apiError})}"></div>

            <div class="mt-2">
                <div th:replace="~{fragments/components :: btn-primary('Entrar', 'submit')}"></div>
            </div>
        </form>
        <div class="relative animate-slide-up delay-300">
            <div class="absolute inset-0 flex items-center" >
                <div class="w-full border-t border-divider" ></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-surface">ou</span>
            </div>
        </div>
        <div class="text-center -mt-6 animate-slide-up delay-500">
            <a href="/user/create" class="text-content-secondary hover:text-content-hover underline">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
