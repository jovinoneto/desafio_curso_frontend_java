<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <!-- 1. Link Simples (Desktop) -->
    <a th:fragment="desktop-link(href, label)"
       th:href="${href}"
       class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white transition">
        [[${label}]]
    </a>

    <!-- 2. Submenu Dropdown (Desktop) -->
    <div th:fragment="desktop-dropdown(label, active)"
         x-data="{ open: false }" @click.away="open = false" class="relative">
        <button @click="open = !open"
                th:class="${active}
                     ? 'rounded-md px-3 py-2 text-border-hover hover:text-text-secondary hover:bg-tertiary flex items-center gap-1 focus:outline-none'
                     : 'rounded-md px-3 py-2 text-sm font-medium text-border-hover hover:text-text-sencondary hover:bg-tertiary flex items-center gap-1 focus:outline-none'">
            [[${label}]]
            <svg class="size-4 opacity-70 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        <div x-show="open" x-transition
             class="absolute left-0 mt-2 w-48 origin-top-left rounded-md bg-primary py-1 outline outline-1 outline-white/10 shadow-lg z-50">
            <!-- O bloco 'links' permite injetar os links de dentro do menu principal -->
            <th:block th:replace="${links}"></th:block>
        </div>
    </div>

    <!-- 3. Link de Submenu (Usado dentro dos Dropdowns/Collapses) -->
    <a th:fragment="submenu-link(href, label)"
       th:href="${href}"
       class="block px-4 py-2 rounded-md text-sm text-border-hover hover:text-text-secondary hover:bg-tertiary transition">
        [[${label}]]
    </a>

    <!-- 4. Submenu Retrátil (Mobile) -->
    <div th:fragment="mobile-collapse(label, active)"
         x-data="{ open: false }" class="mt-1">
        <button @click="open = !open"
                th:class="${active}
                         ? 'w-full text-left rounded-md px-3 py-2 text-text-secondary hover:bg-tertiary hover:text flex justify-between items-center focus:outline-none'
                         : 'w-full text-left rounded-md px-3 py-2 text-text-secondary hover:bg-tertiary hover:text flex justify-between items-center focus:outline-none'">
            [[${label}]]
            <svg class="size-4 opacity-70 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        <div x-show="open" x-transition class="pl-4 mt-1 space-y-1">
            <th:block th:replace="${links}"></th:block>
        </div>
    </div>

    <div th:fragment="nav" class="w-full fixed top-0">
        <!-- script do Alpine.js no cabeçalho ou aqui) -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <!-- Inicializamos o estado do menu mobile global como falso (fechado) -->
        <nav x-data="{ mobileMenuOpen: false }" class="relative bg-primary after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10">
            <div class="mx-auto px-2 sm:px-6 lg:px-8">
                <div class="relative flex h-16 items-center justify-between">

                    <!-- Botão do Menu Mobile -->
                    <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
                        <!-- x-on:click inverte o estado de mobileMenuOpen -->
                        <button type="button"
                                @click="mobileMenuOpen = !mobileMenuOpen"
                                class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/5 hover:text-white focus:outline-none">
                            <span class="sr-only">Open main menu</span>

                            <!-- Ícone de hambúrguer (Exibe se o menu estiver FECHADO) -->
                            <svg :class="mobileMenuOpen ? 'hidden' : 'block'" class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>

                            <!-- Ícone de fechar X (Exibe se o menu estiver ABERTO) -->
                            <svg :class="mobileMenuOpen ? 'block' : 'hidden'" class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>

                    <!-- Logo e Itens de Navegação Desktop -->
                    <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
                        <a th:href="@{/home}">
                            <div class="flex shrink-0 items-center">
                                <img src="https://www.usatec.com.br/images/favicon.png" alt="Your Company" class="h-8 w-auto" />
                            </div>
                        </a>

                        <!-- Menu Desktop com Submenus -->
                        <div class="hidden sm:ml-6 sm:block">
                            <div class="flex space-x-4">

                                <!-- Submenu: Course -->
                                <div th:replace="~{fragments/nav :: desktop-dropdown(label='Course', active=true, links=~{::#course-links})}">
                                    <th:block id="course-links">
                                        <a sec:authorize="hasAnyRole('ADMINISTRATOR', 'COORDINATOR')"
                                                th:replace="~{fragments/nav :: submenu-link(href='/course/create', label='New Course')}"></a>
                                        <a sec:authorize="hasAnyRole('ADMINISTRATOR', 'COORDINATOR')"
                                                th:replace="~{fragments/nav :: submenu-link(href='/course/filter', label='Search')}"></a>
                                        <a th:replace="~{fragments/nav :: submenu-link(href='/course/list', label='List')}"></a>
                                    </th:block>
                                </div>

                                <!-- Submenu: Category -->
                                <div th:replace="~{fragments/nav :: desktop-dropdown(label='Category', active=true, links=~{::#category-links})}">
                                    <th:block id="category-links">
                                        <a sec:authorize="hasAnyRole('ADMINISTRATOR', 'COORDINATOR')"
                                                th:replace="~{fragments/nav :: submenu-link(href='/category/create', label='New Category')}"></a>
                                        <a sec:authorize="hasAnyRole('ADMINISTRATOR', 'COORDINATOR')"
                                                th:replace="~{fragments/nav :: submenu-link(href='/category/filter', label='Search')}"></a>
                                        <a th:replace="~{fragments/nav :: submenu-link(href='/category/list', label='List')}"></a>
                                    </th:block>
                                </div>

                                <!-- Submenu: User -->
                                <div th:replace="~{fragments/nav :: desktop-dropdown(label='User', active=true, links=~{::#user-links})}">
                                    <th:block id="user-links">
                                        <a sec:authorize="isAnonymous()"
                                                th:replace="~{fragments/nav :: submenu-link(href='/user/create', label='New User')}"></a>
                                        <a sec:authorize="isAuthenticated()"
                                                th:replace="~{fragments/nav :: submenu-link(href='/user/update/me', label='Update')}"></a>
                                        <a sec:authorize="hasAnyRole('ADMINISTRATOR', 'COORDINATOR')"
                                            th:replace="~{fragments/nav :: submenu-link(href='/user/filter', label='Search')}"></a>
                                        <a sec:authorize="isAuthenticated()"
                                           th:replace="~{fragments/nav :: submenu-link(href='/user/profile/me', label='Profile')}"></a>
                                    </th:block>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- Lado Direito - login/logoff -->
                    <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">

                        <!-- Botão login -->
                        <a sec:authorize="isAnonymous()" th:href="@{/auth/login}" class="relative rounded-full p-1 text-gray-400 hover:text-white" title="Login">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6">
                                <path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </a>

                        <!-- Botão logoff -->
                        <form sec:authorize="isAuthenticated()" th:action="@{/auth/logout}" method="post" class="flex items-center m-0">
                            <button type="submit" class="relative rounded-full p-1 text-gray-400 hover:text-white" title="Logout">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6">
                                    <path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3-3H21m0 0l-3-3m3 3l-3 3" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </form>
                    </div>

                </div>
            </div>

            <!-- Menu Mobile (Exibe se mobileMenuOpen for verdadeiro) -->
            <div x-show="mobileMenuOpen" x-transition class="sm:hidden bg-secondary">
                <div class="space-y-1 px-2 pt-2 pb-3">

                    <!-- Menu Mobile: Course -->
                    <div th:replace="~{fragments/nav :: mobile-collapse(label='Course', active=true, links=~{::#course-mobile-links})}">
                        <th:block id="course-mobile-links">
                            <a th:replace="~{fragments/nav :: submenu-link(href='/course/cadastrar', label='Cadastrar')}"></a>
                            <a th:replace="~{fragments/nav :: submenu-link(href='/course/listar', label='Listar')}"></a>
                        </th:block>
                    </div>

                    <!-- Menu Mobile: Category -->
                    <div th:replace="~{fragments/nav :: mobile-collapse(label='Category', active=true, links=~{::#category-mobile-links})}">
                        <th:block id="category-mobile-links">
                            <a th:replace="~{fragments/nav :: submenu-link(href='/category/cadastrar', label='Cadastrar')}"></a>
                            <a th:replace="~{fragments/nav :: submenu-link(href='/category/listar', label='Listar')}"></a>
                        </th:block>
                    </div>

                    <!-- Menu Mobile: Teacher -->
                    <div th:replace="~{fragments/nav :: mobile-collapse(label='User', active=true, links=~{::#user-mobile-links})}">
                        <th:block id="user-mobile-links">
                            <a th:replace="~{fragments/nav :: submenu-link(href='/teacher/profile', label='Cadastrar')}"></a>
                            <a th:replace="~{fragments/nav :: submenu-link(href='/administrador/profile', label='Listar')}"></a>
                        </th:block>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</body>
</html>
