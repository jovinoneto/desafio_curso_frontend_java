<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Componentes Tailwind</title>

</head>
<body>

<!-- Input simples -->
    <div th:fragment="input-text(fieldName, placeholder, minlength, apiError)">
        <div class="flex flex-col gap-1 w-full relative">
            <input th:type="${fieldName == 'password' || fieldName == 'passwordConfirm' ? 'password' : 'text'}"
                   th:field="*{__${fieldName}__}"
                   th:minlength="${minlength ?: 0}"
                   th:placeholder="${placeholder}"
                   class="w-full px-4 py-3 bg-surface-secondary text-content rounded-lg outline-none transition-all duration-300
                             ring-1 ring-divider hover:ring-divider-hover focus:ring-1 focus:ring-divider-focus"
                   th:classappend="${apiError?.fieldError(fieldName) != null}  ? 'ring-1 ring-divider-action'"/>
            <small class="text-content-action text-sm -bottom-5 left-0 absolute"
                    th:if="${apiError?.fieldError(fieldName) != null}"
                    th:text="${apiError.fieldError(fieldName)}">
            </small>
        </div>
    </div>

    <!-- Input com label -->
    <div th:fragment="input-label(idName, label, placeholder)">
        <div class="animate-fade-up delay-200 w-full flex flex-col gap-2">
            <label th:for="${idName}"
                   th:text="${label}"
                   class="text-content-secondary uppercase text-xs tracking-wider">
            </label>
            <div class="field-wrap">
                <input th:type="${idName == 'password' ? 'password' : 'text'}"
                       th:id="${idName}"
                       th:name="${idName}"
                       th:placeholder="${placeholder}"
                       class="w-full px-4 py-3 bg-surface-secondary texte-content-secondary rounded-lg outline-none transition-all duration-300
                              ring-1 ring-divider hover:ring-divider-hover focus:ring-1 focus:ring-divider-focus"/>
            </div>
        </div>
    </div>

    <!-- input update with label-->
    <div th:fragment="input-updateLabel(fieldName, placeholder, minlength, apiError)">
        <div class="animate-fade-up delay-200 w-full flex flex-col gap-1">
            <label th:for="${fieldName}"
                   th:text="${fieldName}"
                   class="text-content-secondary uppercase text-xs tracking-wider">
            </label>
            <div class="field-wrap relative">
                <input th:type="${fieldName == 'password' || idName == 'passwordConfirm' ? 'password' : 'text'}"
                       th:field="*{__${fieldName}__}"
                       th:placeholder="${placeholder}"
                       th:minlength="${minlength ?: 0}"
                       class="w-full px-4 py-3 bg-surface-secondary text-content rounded-lg outline-none transition-all duration-300
                                  ring-1 ring-divider hover:ring-divider-hover focus:ring-1 focus:ring-divider-focus"
                       th:classappend="${apiError?.fieldError(fieldName) != null}  ? 'ring-1 ring-divider-action'"/>
                <small class="text-content-action text-sm absolute -bottom-5 left-0"
                       th:if="${apiError?.fieldError(fieldName) != null}"
                       th:text="${apiError.fieldError(fieldName)}">
                </small>
            </div>
        </div>
    </div>

    <!-- label para inputs, ex: Name: John Doe -->
    <div th:fragment="input-view(label, value)">
        <div class="animate-fade-up delay-200 w-full flex flex-col gap-1">
            <span th:text="${label}" class="text-content-secondary uppercase text-xs tracking-wider"></span>
            <span th:text="${value}" class="px-4 py-3 bg-surface-secondary text-content rounded-lg"></span>
        </div>
    </div>

    <!-- botão primário cor azul -->
    <div th:fragment="btn-primary(text, type)">
        <button th:type="${type}"
                class="w-full relative overflow-hidden bg-brand px-6 py-3 rounded-lg font-semibold text-content tracking-wide
                       transition-all duration-200 active:translate-y-0
                       hover:bg-brand-hover

                       after:content-[''] after:absolute after:inset-0
                       after:bg-gradient-to-r after:from-transparent after:via-white/20 after:to-transparent

                       /* Estado Padrão: Quando o mouse SAI, ele volta para a esquerda */
                       after:-translate-x-full after:transition-transform after:duration-300 after:ease-in-out

                       /* Estado Hover: Quando o mouse ENTRA, ele vai para a direita */
                       hover:after:translate-x-full">
            <span th:text="${text}"></span>
        </button>
    </div>

    <!-- botão secundário cor branco -->
    <div th:fragment="btn-secondary(text, type)">
        <button th:type="${type}"
                class="w-full relative overflow-hidden bg-surface-light text-content-secondary px-6 py-3 rounded-lg font-semibold text-white tracking-wide
                       transition-all duration-200 active:translate-y-0
                       hover:bg-surface-secondary
                       after:content-[''] after:absolute after:inset-0
                       after:bg-gradient-to-r after:from-transparent after:via-white/20 after:to-transparent
                       after:-translate-x-full after:transition-transform after:duration-300 after:ease-in-out
                       hover:after:translate-x-full">
            <span th:text="${text}"></span>
        </button>
    </div>

    <!-- botão terciário cor vermelho -->
    <div th:fragment="btn-tertiary(text)">
        <button type="submit"
                class="w-full relative overflow-hidden bg-danger px-6 py-3 rounded-lg font-semibold text-light tracking-wide
                           transition-all duration-200 active:translate-y-0
                           hover:bg-danger-hover

                           after:content-[''] after:absolute after:inset-0
                           after:bg-gradient-to-r after:from-transparent after:via-white/20 after:to-transparent

                           /* Estado Padrão: Quando o mouse SAI, ele volta para a esquerda */
                           after:-translate-x-full after:transition-transform after:duration-300 after:ease-in-out

                           /* Estado Hover: Quando o mouse ENTRA, ele vai para a direita */
                           hover:after:translate-x-full">
            <span th:text="${text}"></span>
        </button>
    </div>

    <!-- botão view -->
    <div th:fragment="btn-view(text, link)">
        <button type="submit"
                th:formaction="@{${link}}"
                class="w-full relative overflow-hidden bg-surface-light text-content-secondary px-6 py-3 rounded-lg font-semibold text-white tracking-wide
                       transition-all duration-200 active:translate-y-0
                       hover:bg-surface-secondary
                       after:content-[''] after:absolute after:inset-0
                       after:bg-gradient-to-r after:from-transparent after:via-white/20 after:to-transparent
                       after:-translate-x-full after:transition-transform after:duration-300 after:ease-in-out
                       hover:after:translate-x-full">
            <span th:text="${text}"></span>
        </button>
    </div>

    <!-- Alert error global -->
    <div th:fragment="errorGlobal">
        <div th:if="${apiError?.hasGlobalError()}"
            class="inset-x-8 flex items-center gap-3 bg-danger/10 border border-danger-hover/25 text-danger text-sm px-4 py-2 rounded-lg">
            <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span th:text="${apiError.globalError()}">Erro ao cadastrar o curso.</span>
        </div>
    </div>>

    <!-- Title page global -->
    <div th:fragment="title-page(text)">
        <h2 class="text-content-focus text-center font-bold text-4xl" th:text="${text}"></h2>
    </div>



</body>
</html>
