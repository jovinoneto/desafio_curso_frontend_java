<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course</title>

    <div th:replace="~{fragments/config :: tailwind-cdn}"></div>
    <div th:replace="~{fragments/config :: font-google}"></div>
</head>
<body class="font-body bg-surface text-content">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="h-screen justify-items-center content-center [@media(max-height:650px)]:pt-16">
        <div class="relative p-8 grid gap-8 rounded-lg shadow-lg w-full max-w-xl">
            <div th:replace="~{fragments/components :: title-page(text='New Course')}"></div>
            <div th:replace="~{fragments/components :: errorGlobal}"></div>
            <ul th:if="${errors}">
                <li th:each="error : ${errors}">
                    <span th:text="${error.value}"></span>
                </li>
            </ul>
            <form th:action="@{/course/create}" th:object="${courseRequest}" method="POST" class="grid gap-6">
                <div th:replace="~{fragments/components :: input-text('name', 'exemplo: java', 2, ${apiError})}"></div>
                <div>
                    <div class="mt-2 relative">
                        <select id="category" th:field="*{categoryId}"
                                class="w-full px-4 py-3 bg-surface-secondary rounded-lg outline-none transition-all duration-300
                                  ring-1 ring-divider hover:ring-divider-hover focus:ring-1 focus:ring-divider-focus"
                                th:classappend="${apiError?.errors()?.containsKey('categoryId')} ? 'ring-1 ring-divider-action' : ''">

                            <option value="" >Category (Select a category)</option>

                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">
                                Name of Category
                            </option>
                        </select>
                        <small class="text-content-action text-sm absolute -bottom-5 left-0"
                                th:if="${apiError?.errors()?.containsKey('categoryId')}"
                                th:text="${apiError.errors().get('categoryId')}">
                        </small>
                    </div>
                </div>
                <div>
                    <div class="mt-2">
                        <select id="user" th:field="*{userId}"
                                class="w-full px-4 py-3 bg-surface-secondary rounded-lg outline-none transition-all duration-300
                              ring-1 ring-divider hover:ring-divider-hover focus:ring-1 focus:ring-divider-focus">
                            <option value="" class="bg-red" selected>Teacher (Select a teacher)</option>
                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.name}">
                                Name of User
                            </option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-2">
                    <div th:replace="~{fragments/components :: btn-primary(Save, submit)}"></div>
                    <a th:href="@{/home}">
                        <div th:replace="~{fragments/components :: btn-secondary(Cancel, button)}"></div>
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
