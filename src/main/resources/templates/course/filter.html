<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Course</title>

    <div th:replace="~{fragments/config :: tailwind-cdn}"></div>
    <div th:replace="~{fragments/config :: font-google}"></div>

    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body class="font-body bg-surface text-content">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="min-h-screen justify-items-center content-center [@media(max-height:650px)]:pt-16 py-8">
        <div class="relative p-8 grid gap-6 rounded-lg shadow-lg w-full max-w-xl">
            <div th:replace="~{fragments/components :: title-page(text='Search Course')}"></div>
            <div th:replace="~{fragments/components :: errorGlobal}"></div>
            <div>
                <form th:action="@{/course/filter}" th:object="${filter}" method="GET" class="w-full">
                    <input type="hidden" name="search" th:value="true"/>
                    <div class="grid gap-2 p-4 rounded-lg shadow-lg">
                        <div class="w-full">
                            <div class="inline-flex w-full justify-between shadow-lg px-6 py-1">
                                <label class="flex items-center gap-2.5 cursor-pointer p-2 text-text-secondary">
                                    <input type="radio" name="active" value="" th:checked="${filter.active == null}" class="sr-only peer">
                                    <span class="w-4 h-4 rounded-full bg-zinc-300 ring-2 ring-offset-2 ring-transparent peer-hover:ring-divider-focus-hover peer-checked:bg-brand peer-checked:ring-divider-focus transition-all shrink-0"></span>
                                    <span class="peer-checked:text-content-secondary peer-hover:text-content-hover peer-checked:shadow-sm transition-all">All</span>
                                </label>
                                <label class="flex items-center gap-2.5 cursor-pointer p-2">
                                    <input type="radio" name="active" value="true" th:checked="${filter.active == true}" class="sr-only peer">
                                    <span class="w-4 h-4 rounded-full bg-zinc-300 ring-2 ring-offset-2 ring-transparent peer-hover:ring-divider-focus-hover peer-checked:bg-brand peer-checked:ring-divider-focus transition-all shrink-0"></span>
                                    <span class="peer-checked:text-content-secondary peer-hover:text-content-hover peer-checked:shadow-sm transition-all">Active</span>
                                </label>
                                <label class="flex items-center gap-2.5 cursor-pointer p-2 text-text-secondary">
                                    <input type="radio" name="active" value="false" th:checked="${filter.active == false}" class="sr-only peer">
                                    <span class="w-4 h-4 rounded-full bg-zinc-300 ring-2 ring-offset-2 ring-transparent peer-hover:ring-divider-focus-hover peer-checked:bg-brand peer-checked:ring-divider-focus transition-all shrink-0"></span>
                                    <span class="peer-checked:text-content-secondary peer-hover:text-content-hover peer-checked:shadow-sm transition-all">Inactive</span>
                                </label>
                            </div>
                        </div>
                        <div class="w-full">
                            <label for="name" class="sr-only">Pesquisar</label>
                            <div class="relative">
                                <input type="text" id="name" th:field="*{name}" placeholder="Search..."
                                       class="w-full rounded-lg bg-surface-tertiary py-2.5 pl-4 pr-10 ring-1 ring-divider hover:ring-divider-hover focus:ring-divider-focus focus:outline-none" />
                                <button type="submit" class="absolute inset-y-0 right-0 flex items-center pr-3 text-content-tertiary transition-all">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-7 w-7">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.602 10.602Z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <form th:action="@{/course/details-redirect}" th:object="${courses}" method="GET" class="w-full grid gap-4">
                <div class="overflow-hidden rounded-lg">
                    <table class="w-full table-auto border-collapse text-center bg-surface-secondary">
                        <thead>
                        <tr class="bg-brand">
                            <th scope="col" class="py-3 w-2 rounded-tl-lg"></th>
                            <th class="py-3 px-4 text-left">Course</th>
                            <th class="py-3 px-4">Category</th>
                            <th class="py-3 px-4">Teacher</th>
                            <th class="py-3 px-4 rounded-tr-lg">Active</th>
                        </tr>
                        </thead>
                        <tbody class="border-b border-divider">
                        <tr th:each="course : ${courses}" class="odd:bg-surface-tertiary even:bg-surface-secondary text-center relative hover:bg-indigo-700/5 transition duration-150">
                            <td class="py-3 px-2 w-2">
                                <input type="radio" name="selectedId" th:id="'course-' + ${course.id}" th:value="${course.id}" class="peer sr-only" required />
                                <label th:for="'course-' + ${course.id}" class="absolute inset-0 cursor-pointer z-0 peer-checked:bg-indigo-600/20 transition duration-150"></label>
                            </td>
                            <td class="py-3 px-2 text-left font-medium pointer-events-none relative z-10 text-text-primary" th:text="${course.name}"></td>
                            <td class="py-3 px-2 pointer-events-none relative z-10" th:text="${course.category?.name}"></td>
                            <td class="py-3 px-2 pointer-events-none relative z-10" th:text="${course.user?.name}"></td>

                            <th:block th:fragment="courseActiveToggle">
                            <td th:id="'course-cell-' + ${course.id}"
                                class="py-3 px-2 relative z-20" >
                                <button
                                        th:id="'course-btn-' + ${course.id}"
                                        th:attr="hx-post=@{/course/{id}/active(id=${course.id})},
                                        hx-target=${'#course-cell-' + course.id}"
                                        hx-swap="outerHTML"
                                        th:hx-headers="|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|"
                                        th:disabled="${!#authorization.expression('hasAnyRole(''ADMINISTRATOR'', ''COORDINATOR'')')}"
                                        class="relative inline-flex items-center h-4 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
                                        th:classappend="${course.active} ? 'bg-indigo-600' : 'bg-slate-700'">

                                        <span class="pointer-events-none relative inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
                                              th:classappend="${course.active} ? 'translate-x-6' : '-translate-x-1'">
                                                <svg class="absolute inset-0 h-full w-full stroke-slate-700 transition-opacity"
                                                     th:classappend="${course.active} ? 'opacity-0' : 'opacity-100'" fill="none" viewBox="0 0 24 24" stroke-width="3">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                                </svg>
                                                <svg class="absolute inset-0 h-full w-full stroke-indigo-600 transition-opacity"
                                                     th:classappend="${course.active} ? 'opacity-100' : 'opacity-0'" fill="none" viewBox="0 0 24 24" stroke-width="3">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                                                </svg>
                                        </span>
                                </button>
                            </td>
                            </th:block>
                        </tr>
                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td class="py-4 px-2 text-center text-sm" colspan="4">Course not found</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="w-full pt-2" th:if="${!#lists.isEmpty(courses)}">
                    <div th:replace="~{fragments/components :: btn-primary('Details', 'submit') }"></div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
